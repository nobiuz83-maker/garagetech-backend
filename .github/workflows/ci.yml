name: Backend CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Laravel tests (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - root
          - auth-service
          - clients-service
          - appointments-service
          - interventions-service
          - inventory-service
          - billing-service
          - accounting-service
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          extensions: bcmath, intl, mbstring, pdo_mysql, pdo_sqlite, zip
          coverage: none
      - name: Install Composer dependencies
        working-directory: ${{ matrix.component == 'root' && '.' || format('services/{0}', matrix.component) }}
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run Laravel tests
        working-directory: ${{ matrix.component == 'root' && '.' || format('services/{0}', matrix.component) }}
        run: php artisan test
