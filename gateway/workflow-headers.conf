proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header Origin $http_origin;
proxy_set_header Cookie $http_cookie;
proxy_set_header X-XSRF-TOKEN $http_x_xsrf_token;
proxy_set_header X-Requested-With $http_x_requested_with;
proxy_set_header X-Company-ID $http_x_company_id;
proxy_set_header Idempotency-Key $http_idempotency_key;
proxy_set_header Authorization "";
proxy_set_header X-User-ID "";
proxy_set_header X-Internal-Service "";
proxy_set_header X-Internal-Timestamp "";
proxy_set_header X-Internal-Nonce "";
proxy_set_header X-Internal-Signature "";
proxy_connect_timeout 2s;
proxy_send_timeout 10s;
proxy_read_timeout 10s;
proxy_next_upstream off;
