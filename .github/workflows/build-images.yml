name: Publish production ARM64 images

on:
  workflow_dispatch:
    inputs:
      publish_images:
        description: Enable only after the public repository is reviewed and ready to publish images
        required: true
        type: choice
        options: [no, yes]
        default: no

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-images-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.inputs.publish_images == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-qemu-action@53851d14592bedcffcf25ea515637cff71ef929a # v3.3.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Define runtime image
        id: metadata
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile
          target: production
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.metadata.outputs.owner }}/vicartech-laravel-runtime:${{ steps.metadata.outputs.sha }}
            ghcr.io/${{ steps.metadata.outputs.owner }}/vicartech-laravel-runtime:${{ steps.metadata.outputs.branch }}
      - name: Publish seven Laravel service images
        env:
          IMAGE_OWNER: ${{ steps.metadata.outputs.owner }}
          IMAGE_TAG: ${{ steps.metadata.outputs.sha }}
        shell: bash
        run: |
          services=(auth clients appointments interventions inventory billing accounting)
          for service_name in "${services[@]}"; do
            docker buildx build \
              --platform linux/arm64 \
              --file infrastructure/production/Dockerfile.service \
              --build-arg "RUNTIME_IMAGE=ghcr.io/${IMAGE_OWNER}/vicartech-laravel-runtime:${IMAGE_TAG}" \
              --build-arg "SERVICE_NAME=${service_name}-service" \
              --tag "ghcr.io/${IMAGE_OWNER}/vicartech-${service_name}-service:${IMAGE_TAG}" \
              --push .
          done
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: infrastructure/production/gateway/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.metadata.outputs.owner }}/vicartech-production-gateway:${{ steps.metadata.outputs.sha }}
            ghcr.io/${{ steps.metadata.outputs.owner }}/vicartech-production-gateway:${{ steps.metadata.outputs.branch }}
