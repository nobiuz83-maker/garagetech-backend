name: Deploy ViCarTech Production

on:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Explicitly approve a production deployment after its environment is configured
        required: true
        type: choice
        options: [no, yes]
        default: no
      backend_image_tag:
        description: Immutable backend GHCR image tag
        required: true
        type: string
      frontend_image_tag:
        description: Immutable frontend GHCR image tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vicartech-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.deploy_production == 'yes'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          persist-credentials: false
      - uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      - name: Configure verified SSH host key
        env:
          DEPLOYMENT_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOYMENT_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
      - name: Upload production deployment files
        env:
          DEPLOYMENT_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOYMENT_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          test -n "$DEPLOYMENT_HOST"
          test -n "$DEPLOYMENT_USER"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOYMENT_USER@$DEPLOYMENT_HOST" \
            'mkdir -p /opt/vicartech/deployment/infrastructure/production'
          rsync -az -e 'ssh -o BatchMode=yes -o StrictHostKeyChecking=yes' \
            infrastructure/production/ \
            "$DEPLOYMENT_USER@$DEPLOYMENT_HOST:/opt/vicartech/deployment/infrastructure/production/"
      - name: Deploy validated images
        env:
          DEPLOYMENT_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOYMENT_USER: ${{ secrets.PRODUCTION_USER }}
          BACKEND_IMAGE_TAG: ${{ inputs.backend_image_tag }}
          FRONTEND_IMAGE_TAG: ${{ inputs.frontend_image_tag }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOYMENT_USER@$DEPLOYMENT_HOST" \
            "/opt/vicartech/deployment/infrastructure/production/deploy.sh '$BACKEND_IMAGE_TAG' '$FRONTEND_IMAGE_TAG'"
