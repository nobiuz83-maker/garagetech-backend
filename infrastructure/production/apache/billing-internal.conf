Listen 8443
<VirtualHost *:8443>
    ServerName billing-service
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>
    SSLEngine on
    SSLCertificateFile /run/vicartech-tls/server.crt
    SSLCertificateKeyFile /run/vicartech-tls/server.key
    SSLCACertificateFile /run/vicartech-tls/ca.crt
    SSLVerifyClient require
    SSLVerifyDepth 1
    SSLOptions +StdEnvVars
    <Location />
        <RequireAny>
            Require expr %{SSL_CLIENT_S_DN_CN} == "gateway"
            <RequireAll>
                Require expr %{SSL_CLIENT_S_DN_CN} == "inventory-service"
                Require expr "%{THE_REQUEST} =~ m#\s/api/internal/v1/billing/interventions/[0-9a-fA-F-]+/status(\?| )#"
            </RequireAll>
        </RequireAny>
    </Location>
    ErrorLog /dev/stderr
    LogFormat "%a %m %U %>s %D" request_summary
    CustomLog /dev/stdout request_summary
</VirtualHost>
