server {
    listen 8080;
    server_name _;
    add_header Cache-Control "no-store" always;
    resolver 127.0.0.11 ipv6=off valid=5s;

    location = /gateway-health {
        default_type application/json;
        return 200 '{"gateway":"isolated","status":"ok"}';
    }

    location = /sanctum/csrf-cookie {
        include /etc/nginx/auth-proxy.conf;
    }

    location = /login {
        include /etc/nginx/auth-proxy.conf;
    }

    location = /logout {
        include /etc/nginx/auth-proxy.conf;
    }

    location = /api/user {
        include /etc/nginx/auth-proxy.conf;
    }

    location ~ ^/api/v1/(?:clients|vehicles)(?:/|$) {
        include /etc/nginx/clients-proxy.conf;
    }

    location ~ ^/api/v1/(?:appointments|appointment-schedule)(?:/|$) {
        include /etc/nginx/appointments-proxy.conf;
    }

    location /api/internal/ {
        return 404;
    }

    location / {
        return 503;
    }

    error_page 502 504 =503 /auth-unavailable;
    location = /auth-unavailable {
        internal;
        default_type application/json;
        return 503 '{"error":"UPSTREAM_SERVICE_UNAVAILABLE"}';
    }
}
