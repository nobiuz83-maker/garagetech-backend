proxy_pass https://interventions-service.internal:8443$request_uri;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/vicartech/tls/ca.crt;
proxy_ssl_certificate /etc/vicartech/tls/gateway/client.crt;
proxy_ssl_certificate_key /etc/vicartech/tls/gateway/client.key;
proxy_ssl_server_name on;
proxy_ssl_name interventions-service.internal;
