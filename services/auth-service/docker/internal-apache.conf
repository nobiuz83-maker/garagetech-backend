Listen 8443
<VirtualHost *:8443>
    ServerName auth-service
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>
    SSLEngine on
    SSLCertificateFile /run/secrets/auth_server_cert
    SSLCertificateKeyFile /run/secrets/auth_server_key
    SSLCACertificateFile /run/secrets/internal_ca_cert
    SSLVerifyClient require
    SSLVerifyDepth 1
    SSLOptions +StdEnvVars
    ErrorLog /dev/stderr
    CustomLog /dev/stdout request_summary
</VirtualHost>
