proxy_pass https://auth-service:8443$request_uri;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header Origin $http_origin;
proxy_set_header Cookie $http_cookie;
proxy_set_header X-XSRF-TOKEN $http_x_xsrf_token;
proxy_set_header X-Requested-With $http_x_requested_with;
proxy_set_header X-User-ID "";
proxy_set_header X-Internal-Service "";
proxy_set_header X-Internal-Timestamp "";
proxy_set_header X-Internal-Nonce "";
proxy_set_header X-Internal-Signature "";
proxy_set_header Authorization "";
proxy_connect_timeout 2s;
proxy_send_timeout 5s;
proxy_read_timeout 5s;
proxy_next_upstream off;
proxy_intercept_errors on;
proxy_ssl_server_name on;
proxy_ssl_name auth-service;
proxy_ssl_verify on;
proxy_ssl_verify_depth 1;
proxy_ssl_trusted_certificate /run/secrets/internal_ca_cert;
proxy_ssl_certificate /run/secrets/gateway_client_cert;
proxy_ssl_certificate_key /run/secrets/gateway_client_key;
proxy_cookie_domain off;
proxy_cookie_path off;
