Listen 8443
<VirtualHost *:8443>
    ServerName appointments-service
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>
    SSLEngine on
    SSLCertificateFile /run/vicartech-tls/server/cert.pem
    SSLCertificateKeyFile /run/vicartech-tls/server/key.pem
    SSLCACertificateFile /run/vicartech-tls/current/ca.pem
    <Location />
        Require expr %{SSL_CLIENT_S_DN_CN} == "gateway"
    </Location>
    SSLVerifyClient require
    SSLVerifyDepth 1
    SSLOptions +StdEnvVars
    ErrorLog /dev/stderr
    LogFormat "%a %m %U %>s %D" request_summary
    CustomLog /dev/stdout request_summary
</VirtualHost>
