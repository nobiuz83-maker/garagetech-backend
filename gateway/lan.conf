server {
    listen 8443 ssl;
    ssl_certificate /run/secrets/lan_server_cert;
    ssl_certificate_key /run/secrets/lan_server_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    server_name _;
    add_header Cache-Control "no-store" always;
    resolver 127.0.0.11 ipv6=off valid=5s;

    location = /gateway-health {
        default_type application/json;
        return 200 '{"gateway":"isolated","status":"ok"}';
    }

    location = /sanctum/csrf-cookie {
        include /etc/nginx/auth-proxy.conf;
    }

    location = /login {
        include /etc/nginx/auth-proxy.conf;
    }

    location = /logout {
        include /etc/nginx/auth-proxy.conf;
    }

    location = /api/user {
        include /etc/nginx/auth-proxy.conf;
    }

    location ~ ^/api/v1/(?:clients|vehicles)(?:/|$) {
        include /etc/nginx/clients-proxy.conf;
    }

    location ~ ^/api/v1/(?:appointments|appointment-schedule)(?:/|$) {
        include /etc/nginx/appointments-proxy.conf;
    }

    location ~ ^/api/v1/interventions(?:/|$) {
        include /etc/nginx/workflow-headers.conf;
        proxy_pass http://interventions-service:8080$request_uri;
    }

    location ~ ^/api/v1/inventory(?:/|$) {
        include /etc/nginx/workflow-headers.conf;
        proxy_pass http://inventory-service:8080$request_uri;
    }

    location ~ ^/api/v1/invoices(?:/|$) {
        include /etc/nginx/workflow-headers.conf;
        proxy_pass http://billing-service:8080$request_uri;
    }

    location ~ /\. { return 404; }

    location /api/ { return 404; }

    location /api/internal/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 502 504 =503 /auth-unavailable;
    location = /auth-unavailable {
        internal;
        default_type application/json;
        return 503 '{"error":"UPSTREAM_SERVICE_UNAVAILABLE"}';
    }
}
